{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
  <h2>Modifier le deal</h2>

  <form method="POST" action="{{ url_for('edit_deal', deal_id=deal.id) }}">
    <div class="mb-3">
      <label for="title" class="form-label">Titre</label>
      <input type="text" class="form-control" id="title" name="title" value="{{ deal.title }}" required>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control" id="description" name="description" rows="3" required>{{ deal.description }}</textarea>
    </div>

    <div class="mb-3">
      <label for="price" class="form-label">Prix</label>
      <input type="text" class="form-control" id="price" name="price" value="{{ deal.price }}" required>
    </div>

    <div class="mb-3">
      <label for="url" class="form-label">URL</label>
      <input type="url" class="form-control" id="url" name="url" value="{{ deal.url }}" required>
    </div>

    <button type="submit" class="btn btn-success">Enregistrer</button>
    <a href="{{ url_for('admin') }}" class="btn btn-secondary">Annuler</a>
  </form>
</div>
{% endblock %}
